<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍冰箱食物管理 & 到期提醒看板</title>
    <!-- 引入 Google Fonts：Inter & 圓體風格字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f6f2; /* 溫潤米白底色 */
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #557A46; /* 森林柔和綠 */
            --primary-hover: #446337;
            --accent-yellow: #f39c12;
            --accent-red: #e74c3c;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 28px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge {
            background: #eef2ec;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn-danger {
            background-color: var(--accent-red);
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }

        /* 搜尋列與操作區 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: var(--card-bg);
            transition: border 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* 雙欄看板版面 */
        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .board {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f2f6;
        }

        .column-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-list {
            flex: 1;
            overflow-y: auto;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        /* 食物卡片設計 */
        .food-card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .food-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .food-card.status-green { border-left: 5px solid #2ecc71; }
        .food-card.status-yellow { border-left: 5px solid var(--accent-yellow); }
        .food-card.status-red { border-left: 5px solid var(--accent-red); background-color: #fffdfd; }

        .food-info-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .food-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .food-owner {
            font-size: 0.85rem;
            background: #eef2ec;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .food-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .food-note {
            font-size: 0.85rem;
            color: #d35400;
            background: #fdf5e6;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 2px;
        }

        .food-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed #e1e4e8;
        }

        .status-tag {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .status-tag.green { background: #e8f8f5; color: #1abc9c; }
        .status-tag.yellow { background: #fef9e7; color: #f1c40f; }
        .status-tag.red { background: #fadbd8; color: var(--accent-red); }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 60px;
            font-size: 0.95rem;
        }

        /* 彈出視窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部標題列 -->
        <header>
            <h1>🧊 宿舍冰箱食物管理看板</h1>
            <div class="header-info">
                <span class="badge" id="current-date-display">今日：2026-11-18</span>
                <span class="badge" id="total-count">冰箱內食物：0 樣</span>
                <button class="btn btn-secondary" onclick="simulate10Days()" title="測試 10 天後自動清空右側紀錄">⏳ 模擬過 10 天</button>
            </div>
        </header>

        <!-- 工具列：搜尋與新增按鈕 -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="搜尋食物名稱、主人或備註..." oninput="render()">
            </div>
