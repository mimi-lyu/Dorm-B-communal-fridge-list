<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿舍冰箱｜食物管理看板</title>
<style>
:root{
  --bg:#f6f3eb; --paper:#fffefa; --ink:#343a32; --muted:#85877d;
  --green:#8fae8b; --green-soft:#e8f1e5; --yellow:#e6c879; --yellow-soft:#fbf3dc;
  --red:#d98982; --red-soft:#fae8e5; --line:#e9e5db; --accent:#6d8c68;
  --shadow:0 8px 24px rgba(58,61,48,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:32px 22px 54px}
header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:15px;background:#e5eee1;display:grid;place-items:center;font-size:24px}
h1{font-size:clamp(22px,3vw,29px);margin:0;font-weight:750;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.stat b{font-size:18px;color:var(--ink);margin-right:5px}
.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:650;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--accent);color:white}
.secondary{background:#ece9e1;color:#62665c}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.danger-btn{background:var(--red-soft);color:#9c5751}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.search-wrap{flex:1;position:relative}
.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#a3a59b}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 15px 13px 42px;outline:none}
.search:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#a9bea4;box-shadow:0 0 0 3px #e9f0e6}
.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.column{background:rgba(255,255,255,.42);border:1px solid var(--line);border-radius:22px;padding:17px}
.column-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.column-title{font-weight:750;font-size:17px;display:flex;gap:8px;align-items:center}
.count{font-size:12px;color:var(--muted);background:#efede6;padding:4px 9px;border-radius:99px}
.history-head{align-items:flex-start}
.history-note{font-size:11px;color:var(--muted);margin-top:4px}
.cards{display:flex;flex-direction:column;gap:11px}
.food-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.food-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.food-card.yellow:before{background:var(--yellow)}
.food-card.red:before{background:var(--red)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.food-name{font-size:16px;font-weight:750;word-break:break-word}
.owner{font-size:12px;color:var(--muted);margin-top:4px}
.status{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;background:var(--green-soft);color:#547653}
.status.yellow{background:var(--yellow-soft);color:#98752d}
.status.red{background:var(--red-soft);color:#a85852}
.meta{display:flex;flex-wrap:wrap;gap:7px 12px;color:var(--muted);font-size:12px;margin-top:10px}
.note{font-size:12px;color:#6f746a;background:#f5f3ed;border-radius:9px;padding:7px 9px;margin-top:9px;white-space:pre-wrap;word-break:break-word}
.card-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.small-btn{border:0;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:650}
.done-btn{background:#e7efe3;color:#587652}
.restore-btn{background:#e7efe3;color:#587652}
.remove-btn{background:#f3ece8;color:#8b7468}
.empty{color:#9b9d93;text-align:center;padding:28px 10px;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:rgba(37,42,34,.32);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-backdrop.open{display:flex}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(30,35,28,.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h2{margin:0;font-size:20px}
.close{border:0;background:#f0eee8;border-radius:10px;width:34px;height:34px;font-size:18px;color:#777}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:650}
.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:white;outline:none}
.field textarea{resize:vertical;min-height:74px}
.mode-row{display:flex;gap:8px}
.mode-row button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:#f6f4ee;color:var(--muted)}
.mode-row button.active{border-color:#9cb296;background:var(--green-soft);color:#587652;font-weight:700}
.preview{border-radius:12px;padding:11px 12px;background:#f3f2ec;font-size:13px;color:var(--muted)}
.preview b{color:var(--ink)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#3f493d;color:white;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1}
@media(max-width:760px){.shell{padding:22px 14px 38px}.board{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar .primary{white-space:nowrap}.stats{width:100%}.stat{flex:1}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="logo">🧊</div>
      <div><h1>宿舍冰箱食物管理</h1><div class="sub" id="todayText">一起惜食，讓冰箱清清爽爽。</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="totalCount">0</b>冰箱食物</div>
      <div class="stat"><b id="urgentCount">0</b>項需留意</div>
      <div class="header-actions">
        <button class="btn ghost" id="advanceBtn">⏩ 模擬快轉 10 天</button>
        <button class="btn secondary" id="resetBtn">清空所有資料</button>
      </div>
    </div>
  </header>
  <div class="toolbar">
    <div class="search-wrap"><span>⌕</span><input class="search" id="searchInput" placeholder="搜尋食物、主人或備註…" autocomplete="off"></div>
    <button class="btn primary" id="addBtn">＋ 新增食物</button>
  </div>
  <main class="board">
    <section class="column">
      <div class="column-head"><div class="column-title">🧊 冰箱冷藏區</div><span class="count" id="fridgeCount">0 項</span></div>
      <div class="cards" id="fridgeCards"></div>
    </section>
    <section class="column">
      <div class="column-head history-head">
        <div><div class="column-title">🍽️ 已吃完／歷史紀錄</div><div class="history-note">紀錄滿 10 天自動清空</div></div>
        <button class="btn danger-btn" id="clearHistoryBtn">立即清空</button>
      </div>
      <div class="cards" id="historyCards"></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header"><h2 id="modalTitle">新增食物</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div>
    <form id="foodForm">
      <div class="form-grid">
        <div class="field"><label for="foodName">食物名稱 *</label><input id="foodName" required maxlength="80" placeholder="例如：無糖豆漿"></div>
        <div class="field"><label for="owner">食物主人 *</label><input id="owner" required maxlength="50" placeholder="例如：小明／A床"></div>
        <div class="field"><label for="putDate">放入日期 *</label><input id="putDate" type="date" required></div>
        <div class="field full"><label>保存期限設定</label><div class="mode-row"><button type="button" id="dateModeBtn" class="active">指定到期日</button><button type="button" id="daysModeBtn">可保存天數</button></div></div>
        <div class="field full" id="expiryField"><label for="expiryDate">到期日 *</label><input id="expiryDate" type="date"></div>
        <div class="field full" id="daysField" style="display:none"><label for="shelfDays">可保存天數 *</label><input id="shelfDays" type="number" min="0" step="1" placeholder="例如：7"></div>
        <div class="field full"><div class="preview" id="expiryPreview">請設定到期日，預覽提醒狀態。</div></div>
        <div class="field full"><label for="notes">備註（選填）</label><textarea id="notes" maxlength="300" placeholder="例如：上層架、可分享"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button type="submit" class="btn primary">儲存食物</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY = "dormFridgeTracker.v1";
const DAY_MS = 86400000;
let simulatedOffset = 0;
let mode = "date";
let editingId = null;
let foods = [];

const $ = (id)=>document.getElementById(id);
function dateOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dateStr(d){const x=dateOnly(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;}
function parseDate(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function today(){return dateOnly(new Date(Date.now()+simulatedOffset*DAY_MS));}
function shiftDate(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffDays(a,b){return Math.round((dateOnly(a)-dateOnly(b))/DAY_MS);}
function fmt(s){const d=parseDate(s);return d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:"—";}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function status(days){if(days<=0)return {cls:"red",text:days<0?`已過期 ${Math.abs(days)} 天`:"今日到期"};if(days<=2)return {cls:"yellow",text:`剩 ${days} 天`};return {cls:"green",text:`剩 ${days} 天`};}
function getExpiry(food){return food.expiry;}
function remaining(food){return diffDays(parseDate(food.expiry),today());}
function makeSamples(){ return []; }
function load(){
 try{
   const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));
   foods=Array.isArray(parsed)?parsed:[];
 }catch{foods=[];}
 // Remove previously seeded demo entries (known sample names) from prior versions.
 const demoNames = new Set(["無糖豆漿","草莓","優格","便當盒（剩菜）","鮮奶"]);
 foods=foods.filter(f=>!demoNames.has(f.name));
 purgeHistory();save();
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(foods));}
function purgeHistory(){
 const now=today();
 foods=foods.filter(f=>!f.doneAt || diffDays(now,parseDate(f.doneAt))<10);
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),2200);}
function render(){
 purgeHistory();save();
 const query=$("searchInput").value.trim().toLowerCase();
 const active=foods.filter(f=>!f.doneAt).filter(matches).sort((a,b)=>remaining(a)-remaining(b));
 const history=foods.filter(f=>f.doneAt).filter(matches).sort((a,b)=>parseDate(b.doneAt)-parseDate(a.doneAt));
 $("fridgeCards").innerHTML=active.map(cardHTML).join("")||`<div class="empty">什麼都沒有！  不要看我！</div>`;
 $("historyCards").innerHTML=history.map(historyHTML).join("")||`<div class="empty">還沒有吃完的紀錄。</div>`;
 $("totalCount").textContent=foods.filter(f=>!f.doneAt).length;
 $("urgentCount").textContent=foods.filter(f=>!f.doneAt&&remaining(f)<=2).length;
 $("fridgeCount").textContent=`${foods.filter(f=>!f.doneAt).length} 項`;
 $("todayText").textContent=`今天 ${fmt(dateStr(today()))} · 一起惜食，讓冰箱清清爽爽。${simulatedOffset?`（測試日期 +${simulatedOffset} 天）`:""}`;
}
function matches(f){const q=$("searchInput").value.trim().toLowerCase();return !q||[f.name,f.owner,f.notes].some(v=>String(v||"").toLowerCase().includes(q));}
function cardHTML(f){
 const d=remaining(f),s=status(d);
 return `<article class="food-card ${s.cls}" data-id="${f.id}">
  <div class="card-top"><div><div class="food-name">${escapeHTML(f.name)}</div><div class="owner">👤 ${escapeHTML(f.owner)}</div></div><span class="status ${s.cls}">${s.text}</span></div>
  <div class="meta"><span>📥 放入 ${fmt(f.putDate)}</span><span>⌛ 到期 ${fmt(f.expiry)}</span></div>
  ${f.notes?`<div class="note">${escapeHTML(f.notes)}</div>`:""}
  <div class="card-actions"><button class="small-btn remove-btn" data-action="delete">刪除</button><button class="small-btn done-btn" data-action="done">✓ 已吃完</button></div>
 </article>`;
}
function historyHTML(f){
 const elapsed=diffDays(today(),parseDate(f.doneAt)),left=Math.max(0,10-elapsed);
 return `<article class="food-card" data-id="${f.id}">
  <div class="card-top"><div><div class="food-name">${escapeHTML(f.name)}</div><div class="owner">👤 ${escapeHTML(f.owner)}</div></div><span class="status">已吃完</span></div>
  <div class="meta"><span>🍽️ 吃完 ${fmt(f.doneAt)}</span><span>🧹 ${left} 天後清除</span><span>保存 ${Number(f.shelfDays)||0} 天</span></div>
  ${f.notes?`<div class="note">${escapeHTML(f.notes)}</div>`:""}
  <div class="card-actions"><button class="small-btn remove-btn" data-action="delete">刪除紀錄</button><button class="small-btn restore-btn" data-action="restock">↻ 買一樣的</button></div>
 </article>`;
}
function openModal(){
 editingId=null;$("modalTitle").textContent="新增食物";$("foodForm").reset();
 $("putDate").value=dateStr(today());$("expiryDate").value=dateStr(shiftDate(today(),3));
 $("shelfDays").value="3";setMode("date");preview();$("modalBackdrop").classList.add("open");$("foodName").focus();
}
function closeModal(){$("modalBackdrop").classList.remove("open");}
function setMode(m){mode=m;$("dateModeBtn").classList.toggle("active",m==="date");$("daysModeBtn").classList.toggle("active",m==="days");$("expiryField").style.display=m==="date"?"":"none";$("daysField").style.display=m==="days"?"":"none";preview();}
function computeExpiry(){
 const put=parseDate($("putDate").value);if(!put)return "";
 if(mode==="date")return $("expiryDate").value;
 const n=Number($("shelfDays").value);if(!Number.isFinite(n)||n<0)return "";
 return dateStr(shiftDate(put,n));
}
function preview(){
 const expiry=computeExpiry();if(!expiry){$("expiryPreview").innerHTML="請完成保存期限設定。";return;}
 const d=diffDays(parseDate(expiry),today()),s=status(d);
 $("expiryPreview").innerHTML=`預計到期：<b>${fmt(expiry)}</b>　<span style="color:${s.cls==="red"?"#a85852":s.cls==="yellow"?"#98752d":"#547653"};font-weight:700">${s.text}</span>`;
}
$("addBtn").addEventListener("click",openModal);
$("closeModal").addEventListener("click",closeModal);
$("cancelBtn").addEventListener("click",closeModal);
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal();});
$("dateModeBtn").addEventListener("click",()=>setMode("date"));
$("daysModeBtn").addEventListener("click",()=>setMode("days"));
["putDate","expiryDate","shelfDays"].forEach(id=>$(id).addEventListener("input",preview));
$("searchInput").addEventListener("input",render);
$("foodForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=$("foodName").value.trim(),owner=$("owner").value.trim(),putDate=$("putDate").value,expiry=computeExpiry();
 if(!name||!owner||!putDate||!expiry){toast("請填寫必填欄位和保存期限");return;}
 if(parseDate(expiry)<parseDate(putDate)){toast("到期日不能早於放入日期");return;}
 const days=mode==="days"?Number($("shelfDays").value):diffDays(parseDate(expiry),parseDate(putDate));
 foods.unshift({id:crypto.randomUUID(),name,owner,putDate,expiry,shelfDays:days,notes:$("notes").value.trim(),doneAt:null});
 save();render();closeModal();toast("已新增食物！");
});
document.addEventListener("click",e=>{
 const btn=e.target.closest("button[data-action]");if(!btn)return;
 const card=btn.closest("[data-id]"),f=foods.find(x=>x.id===card?.dataset.id);if(!f)return;
 const action=btn.dataset.action;
 if(action==="done"){f.doneAt=dateStr(today());toast("已移至吃完紀錄");}
 if(action==="restock"){f.putDate=dateStr(today());f.expiry=dateStr(shiftDate(today(),Number(f.shelfDays)||0));f.doneAt=null;toast("已放回冰箱，日期更新為今天");}
 if(action==="delete"){foods=foods.filter(x=>x.id!==f.id);toast("已刪除");}
 save();render();
});
$("clearHistoryBtn").addEventListener("click",()=>{
 if(!foods.some(f=>f.doneAt)){toast("目前沒有吃完紀錄");return;}
 if(confirm("確定清空所有已吃完紀錄？此操作無法復原。")){foods=foods.filter(f=>!f.doneAt);save();render();toast("歷史紀錄已清空");}
});
$("advanceBtn").addEventListener("click",()=>{
 simulatedOffset+=10;render();toast("測試日期已快轉 10 天（不修改真實系統日期）");
});
$("resetBtn").addEventListener("click",()=>{
 if(confirm("確定清空冰箱與所有吃完紀錄？此操作無法復原。")){simulatedOffset=0;foods=[];save();render();toast("所有資料已清空");}
});
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
load();render();
</script>
</body>
</html>
